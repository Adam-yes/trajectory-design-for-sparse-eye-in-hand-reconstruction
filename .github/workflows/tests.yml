name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    name: package (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dev,analysis]' trimesh
      - run: python -m ruff check .
      - run: python -m pytest -q

  study:
    name: study (full run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r study/requirements.txt
      - run: python study/run_all.py
